<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BANKNIFTY Journal</title>
<style>
  :root{
    --bg:#0F1218;
    --panel:#161B24;
    --panel-2:#1C2330;
    --line:#262E3D;
    --text:#E7E9EE;
    --muted:#8891A3;
    --green:#33D17A;
    --green-dim:#1B4A34;
    --red:#F1594F;
    --red-dim:#4A2220;
    --amber:#E8A93A;
    --ce:#4E9FE8;
    --pe:#C978E8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
    padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    max-width:1180px;
    margin:0 auto;
  }
  .num{font-family:'JetBrains Mono','SF Mono',Consolas,monospace; font-variant-numeric:tabular-nums;}

  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
  header h1{font-size:19px;font-weight:600;margin:0;letter-spacing:0.2px;}
  header .sub{color:var(--muted);font-size:12.5px;}

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .stat{background:var(--panel);padding:12px 14px;}
  .stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
  .stat .v{font-size:19px;font-weight:600;}
  .pos{color:var(--green);}
  .neg{color:var(--red);}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
    margin-bottom:18px;
  }
  .panel h2{font-size:13px;font-weight:600;margin:0 0 12px 0;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}

  form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  form .full{grid-column:1/-1;}
  label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;}
  input,select,textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--text);
    padding:7px 8px;
    font-size:13.5px;
    font-family:inherit;
  }
  input.num,textarea{font-family:'JetBrains Mono',monospace;}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--amber);border-color:var(--amber);}
  textarea{resize:vertical;min-height:38px;font-family:inherit;}

  .toggle-group{display:flex;gap:6px;}
  .toggle-group button{
    flex:1;padding:7px 0;border-radius:5px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;
  }
  .toggle-group button.active[data-v="CE"]{background:rgba(78,159,232,0.15);border-color:var(--ce);color:var(--ce);}
  .toggle-group button.active[data-v="PE"]{background:rgba(201,120,232,0.15);border-color:var(--pe);color:var(--pe);}
  .toggle-group button.active[data-v="BUY"]{background:rgba(51,209,122,0.15);border-color:var(--green);color:var(--green);}
  .toggle-group button.active[data-v="SELL"]{background:rgba(241,89,79,0.15);border-color:var(--red);color:var(--red);}

  .submit-row{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:2px;}
  button.primary{
    background:var(--amber);color:#1A1300;border:none;border-radius:5px;
    padding:9px 18px;font-weight:600;font-size:13.5px;cursor:pointer;
  }
  button.primary:hover{filter:brightness(1.08);}
  button.ghost{
    background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:5px;padding:9px 14px;font-size:13px;cursor:pointer;
  }

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;color:var(--muted);font-weight:500;font-size:11px;
    text-transform:uppercase;letter-spacing:0.05em;padding:6px 8px;border-bottom:1px solid var(--line);
  }
  tbody td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:hover{background:var(--panel-2);}
  .tag{
    display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;
  }
  .tag.CE{background:rgba(78,159,232,0.15);color:var(--ce);}
  .tag.PE{background:rgba(201,120,232,0.15);color:var(--pe);}
  .tag.BUY{color:var(--green);}
  .tag.SELL{color:var(--red);}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px;}
  .del:hover{color:var(--red);}
  .notes-cell{max-width:180px;color:var(--muted);font-size:12px;}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:13px;}
  .status{font-size:11.5px;color:var(--muted);margin-top:6px;min-height:14px;}

  .settings-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;}
  .settings-grid .save-row{display:flex;}
  .settings-grid button.primary{width:100%;}
  .settings-hint{color:var(--muted);font-size:11.5px;margin-top:8px;}

  .daily-banner{
    display:flex;flex-wrap:wrap;gap:18px;align-items:center;
    border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:18px;
  }
  .daily-banner.ok{background:var(--panel);}
  .daily-banner.locked-profit{background:var(--green-dim);border-color:var(--green);}
  .daily-banner.locked-loss{background:var(--red-dim);border-color:var(--red);}
  .daily-banner .d-item{font-size:12.5px;color:var(--muted);}
  .daily-banner .d-item b{color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:600;}
  .daily-banner .d-msg{font-weight:600;font-size:13px;margin-left:auto;}

  .cooldown-banner{
    display:flex;align-items:center;gap:14px;
    border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:18px;
  }
  .cooldown-banner.idle{background:var(--panel);color:var(--muted);}
  .cooldown-banner.waiting{background:rgba(232,169,58,0.12);border-color:var(--amber);}
  .cooldown-banner.ready{background:var(--green-dim);border-color:var(--green);}
  .cooldown-banner .c-time{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;}
  .cooldown-banner.waiting .c-time{color:var(--amber);}
  .cooldown-banner.ready .c-time{color:var(--green);}
  .cooldown-banner .c-label{font-size:12.5px;color:var(--muted);}

  form.locked{opacity:0.45;pointer-events:none;}
</style>
</head>
<body>

<header>
  <div>
    <h1>BANKNIFTY Journal</h1>
    <div class="sub">Intraday options — synced to your Postgres backend</div>
  </div>
  <button type="button" class="ghost" id="logoutBtn" style="padding:6px 14px;">Log out</button>
</header>

<div class="stats" id="stats"></div>

<div class="daily-banner" id="dailyBanner"></div>

<div class="cooldown-banner" id="cooldownBanner"></div>

<div class="panel">
  <h2>Daily limits</h2>
  <form id="settingsForm" class="settings-grid">
    <div><label>Capital (₹)</label><input class="num" type="number" id="s_capital" step="1"></div>
    <div><label>Profit lock — from (₹)</label><input class="num" type="number" id="s_profitMin" step="1"></div>
    <div><label>Profit lock — to (₹)</label><input class="num" type="number" id="s_profitMax" step="1"></div>
    <div><label>Loss lock — from (₹)</label><input class="num" type="number" id="s_lossMin" step="1"></div>
    <div><label>Loss lock — to (₹)</label><input class="num" type="number" id="s_lossMax" step="1"></div>
  </form>
  <div class="settings-hint">Once today's P&L reaches the "from" value of either range, new entries lock for the rest of the day. Settings save as you edit.</div>
</div>

<div class="panel">
  <h2>Log a trade</h2>
  <form id="tradeForm">
    <div><label>Date</label><input type="date" id="f_date" required></div>
    <div><label>Entry time</label><input type="time" id="f_time"></div>
    <div><label>Strike</label><input class="num" type="number" id="f_strike" placeholder="52000" required></div>
    <div>
      <label>Type</label>
      <div class="toggle-group" id="g_type">
        <button type="button" data-v="CE">CE</button>
        <button type="button" data-v="PE">PE</button>
      </div>
    </div>
    <div>
      <label>Side</label>
      <div class="toggle-group" id="g_side">
        <button type="button" data-v="BUY">Buy</button>
        <button type="button" data-v="SELL">Sell</button>
      </div>
    </div>
    <div><label>Qty (lots × 35)</label><input class="num" type="number" id="f_qty" placeholder="1" value="1" required></div>
    <div>
      <label>Broker</label>
      <input type="text" id="f_broker" list="brokerList" placeholder="Dhan">
      <datalist id="brokerList">
        <option value="Dhan">
        <option value="Kotak Neo">
      </datalist>
    </div>

    <div><label>Entry price</label><input class="num" type="number" step="0.05" id="f_entry" required></div>
    <div><label>Exit price</label><input class="num" type="number" step="0.05" id="f_exit"></div>
    <div><label>Exit time</label><input type="time" id="f_exittime"></div>
    <div class="full" style="grid-column:span 2;"><label>Setup / reason</label><input type="text" id="f_setup" placeholder="e.g. 3m breakout retest"></div>

    <div class="full"><label>Notes</label><textarea id="f_notes" placeholder="What went right/wrong, emotion, execution notes..."></textarea></div>

    <div class="submit-row">
      <span class="status" id="formStatus"></span>
      <button type="button" class="ghost" id="resetBtn">Clear</button>
      <button type="submit" class="primary">Add trade</button>
    </div>
  </form>
</div>

<div class="panel">
  <h2>Trades</h2>
  <div id="tableWrap"><div class="empty">Loading…</div></div>
</div>

<script>
const storage = {
  async get(key){
    try{
      const res = await fetch(`/api/kv/${encodeURIComponent(key)}`);
      if(res.status === 401){ window.location.href = '/login'; return null; }
      if(res.status === 404) return null;
      if(!res.ok) return null;
      const data = await res.json();
      return {key, value: data.value};
    }catch(e){ return null; }
  },
  async set(key, value){
    try{
      const res = await fetch(`/api/kv/${encodeURIComponent(key)}`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({value})
      });
      if(res.status === 401){ window.location.href = '/login'; return null; }
      if(!res.ok) return null;
      return {key, value};
    }catch(e){ return null; }
  }
};

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  try{ await fetch('/api/logout', {method:'POST'}); }catch(e){}
  window.location.href = '/login';
});

const LOT = 35; // BANKNIFTY lot size — update here if it changes
const DEFAULT_SETTINGS = {capital:55000, profitMin:1000, profitMax:1500, lossMin:1800, lossMax:2200};
let trades = [];
let settings = {...DEFAULT_SETTINGS};
let typeVal = null, sideVal = null;

const $ = id => document.getElementById(id);
const todayStr = () => new Date().toISOString().slice(0,10);

function todayPnl(){
  const today = todayStr();
  return trades
    .filter(t => t.date === today)
    .reduce((sum,t) => { const p = calcPnl(t); return sum + (p || 0); }, 0);
}

function lockState(){
  const p = todayPnl();
  if(p >= settings.profitMin) return {locked:true, kind:'profit', pnl:p};
  if(p <= -settings.lossMin) return {locked:true, kind:'loss', pnl:p};
  return {locked:false, kind:null, pnl:p};
}

async function loadSettings(){
  try{
    const res = await storage.get('banknifty-settings');
    settings = res ? {...DEFAULT_SETTINGS, ...JSON.parse(res.value)} : {...DEFAULT_SETTINGS};
  }catch(e){
    settings = {...DEFAULT_SETTINGS};
  }
  $('s_capital').value = settings.capital;
  $('s_profitMin').value = settings.profitMin;
  $('s_profitMax').value = settings.profitMax;
  $('s_lossMin').value = settings.lossMin;
  $('s_lossMax').value = settings.lossMax;
}

async function saveSettings(){
  const next = {
    capital: parseFloat($('s_capital').value) || 0,
    profitMin: parseFloat($('s_profitMin').value) || 0,
    profitMax: parseFloat($('s_profitMax').value) || 0,
    lossMin: parseFloat($('s_lossMin').value) || 0,
    lossMax: parseFloat($('s_lossMax').value) || 0,
  };
  settings = next;
  try{
    await storage.set('banknifty-settings', JSON.stringify(settings));
  }catch(e){ /* best effort */ }
  render();
}

['s_capital','s_profitMin','s_profitMax','s_lossMin','s_lossMax'].forEach(id=>{
  $(id).addEventListener('change', saveSettings);
});

function renderDailyBanner(){
  const st = lockState();
  const el = $('dailyBanner');
  const pnlCls = st.pnl>0?'pos':(st.pnl<0?'neg':'');
  let cls = 'ok', msg = 'Open for entries';
  if(st.locked && st.kind==='profit'){ cls='locked-profit'; msg = 'Profit target reached — locked for today'; }
  if(st.locked && st.kind==='loss'){ cls='locked-loss'; msg = 'Loss limit reached — locked for today'; }
  el.className = 'daily-banner ' + cls;
  el.innerHTML = `
    <div class="d-item">Today's P&L <b class="${pnlCls}">${fmtMoney(st.pnl)}</b></div>
    <div class="d-item">Profit lock <b>₹${settings.profitMin.toLocaleString('en-IN')}–₹${settings.profitMax.toLocaleString('en-IN')}</b></div>
    <div class="d-item">Loss lock <b>₹${settings.lossMin.toLocaleString('en-IN')}–₹${settings.lossMax.toLocaleString('en-IN')}</b></div>
    <div class="d-item">Capital <b>₹${settings.capital.toLocaleString('en-IN')}</b></div>
    <div class="d-msg">${msg}</div>
  `;
  $('tradeForm').classList.toggle('locked', st.locked);
}

function setToggle(groupId, val){
  document.querySelectorAll('#'+groupId+' button').forEach(b=>{
    b.classList.toggle('active', b.dataset.v === val);
  });
}
$('g_type').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  typeVal = e.target.dataset.v; setToggle('g_type', typeVal);
});
$('g_side').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  sideVal = e.target.dataset.v; setToggle('g_side', sideVal);
});

function calcPnl(t){
  if(t.exit === null || t.exit === undefined || t.exit === '') return null;
  const diff = t.side === 'BUY' ? (t.exit - t.entry) : (t.entry - t.exit);
  return +(diff * t.qty * LOT).toFixed(2);
}

function fmtMoney(v){
  if(v === null || v === undefined) return '—';
  const sign = v > 0 ? '+' : '';
  return sign + '₹' + v.toLocaleString('en-IN', {maximumFractionDigits:2});
}

async function loadTrades(){
  try{
    const res = await storage.get('banknifty-trades');
    trades = res ? JSON.parse(res.value) : [];
  }catch(e){
    trades = [];
  }
  if(trades.length === 0){
    trades.push({
      id: 'demo-' + Date.now().toString(36),
      date: todayStr(),
      time: '09:35',
      strike: '54000',
      optType: 'CE',
      side: 'BUY',
      qty: 1,
      entry: 220,
      exit: 265,
      setup: '3m breakout retest',
      notes: 'Demo entry — clean entry, held through pullback. Delete anytime.',
    });
    await saveTrades();
  }
  render();
}

async function saveTrades(){
  try{
    await storage.set('banknifty-trades', JSON.stringify(trades));
  }catch(e){
    $('formStatus').textContent = 'Could not save — try again.';
  }
}

function render(){
  renderStats();
  renderTable();
  renderDailyBanner();
  renderCooldownBanner();
}

function renderStats(){
  const closed = trades.filter(t => t.exit !== null && t.exit !== undefined && t.exit !== '');
  const pnls = closed.map(calcPnl);
  const total = pnls.reduce((a,b)=>a+b, 0);
  const wins = pnls.filter(p=>p>0);
  const losses = pnls.filter(p=>p<0);
  const winRate = closed.length ? (wins.length/closed.length*100) : 0;
  const avgWin = wins.length ? wins.reduce((a,b)=>a+b,0)/wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((a,b)=>a+b,0)/losses.length : 0;

  const stats = [
    {k:'Total trades', v: trades.length, cls:''},
    {k:'Closed', v: closed.length, cls:''},
    {k:'Win rate', v: closed.length? winRate.toFixed(1)+'%' : '—', cls:''},
    {k:'Total P&L', v: fmtMoney(total), cls: total>0?'pos':(total<0?'neg':'')},
    {k:'Avg win', v: wins.length? fmtMoney(avgWin):'—', cls:'pos'},
    {k:'Avg loss', v: losses.length? fmtMoney(avgLoss):'—', cls:'neg'},
  ];
  $('stats').innerHTML = stats.map(s=>
    `<div class="stat"><div class="k">${s.k}</div><div class="v num ${s.cls}">${s.v}</div></div>`
  ).join('');
}

function renderTable(){
  if(!trades.length){
    $('tableWrap').innerHTML = '<div class="empty">No trades logged yet. Add your first one above.</div>';
    return;
  }
  const rows = [...trades].sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time)).map(t=>{
    const pnl = calcPnl(t);
    const pnlCls = pnl===null?'':(pnl>0?'pos':(pnl<0?'neg':''));
    return `<tr>
      <td class="num">${t.date}${t.time? ' '+t.time:''}</td>
      <td class="num">${t.strike}</td>
      <td><span class="tag ${t.optType}">${t.optType}</span></td>
      <td><span class="tag ${t.side}">${t.side}</span></td>
      <td class="num">${t.qty}</td>
      <td class="num">${t.entry}</td>
      <td class="num">${t.exit ?? '—'}${t.exitTime? ' <span style=\"color:var(--muted)\">'+t.exitTime+'</span>':''}</td>
      <td class="num ${pnlCls}">${pnl===null?'open':fmtMoney(pnl)}</td>
      <td>${t.broker ? esc(t.broker) : '—'}</td>
      <td>${t.setup ? esc(t.setup) : '—'}</td>
      <td class="notes-cell">${t.notes ? esc(t.notes) : ''}</td>
      <td><button class="del" data-id="${t.id}" title="Delete">✕</button></td>
    </tr>`;
  }).join('');

  $('tableWrap').innerHTML = `<table>
    <thead><tr>
      <th>Date/time</th><th>Strike</th><th>Type</th><th>Side</th><th>Qty</th>
      <th>Entry</th><th>Exit</th><th>P&L</th><th>Broker</th><th>Setup</th><th>Notes</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  $('tableWrap').querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      trades = trades.filter(t=>t.id !== btn.dataset.id);
      render();
      await saveTrades();
    });
  });
}

function esc(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

let cooldownUntil = null; // epoch ms — next entry allowed after this

async function loadCooldown(){
  try{
    const res = await storage.get('banknifty-cooldown');
    cooldownUntil = res ? parseInt(JSON.parse(res.value), 10) : null;
  }catch(e){
    cooldownUntil = null;
  }
}

async function saveCooldown(){
  try{
    await storage.set('banknifty-cooldown', JSON.stringify(cooldownUntil));
  }catch(e){ /* best effort */ }
}

function cooldownRemainingMs(){
  if(!cooldownUntil) return 0;
  return Math.max(0, cooldownUntil - Date.now());
}

function fmtCountdown(ms){
  const totalSec = Math.ceil(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function renderCooldownBanner(){
  const el = $('cooldownBanner');
  const remaining = cooldownRemainingMs();
  if(!cooldownUntil){
    el.className = 'cooldown-banner idle';
    el.innerHTML = `<div class="c-label">Next-entry timer</div><div class="c-time">—</div><div class="c-label">Starts once you log a trade</div>`;
  } else if(remaining > 0){
    el.className = 'cooldown-banner waiting';
    el.innerHTML = `<div class="c-label">Next entry in</div><div class="c-time">${fmtCountdown(remaining)}</div><div class="c-label">15 min since last entry time</div>`;
  } else {
    el.className = 'cooldown-banner ready';
    el.innerHTML = `<div class="c-label">Timer</div><div class="c-time">Ready</div><div class="c-label">You can log the next trade</div>`;
  }
  updateFormLock();
}

function updateFormLock(){
  const daily = lockState();
  const cooling = cooldownRemainingMs() > 0;
  $('tradeForm').classList.toggle('locked', daily.locked || cooling);
}
async function loadBrokers(){
  let brokers = ['Dhan', 'Kotak Neo'];
  try{
    const res = await storage.get('banknifty-brokers');
    if(res) brokers = JSON.parse(res.value);
  }catch(e){ /* use defaults */ }
  renderBrokerList(brokers);
}

function renderBrokerList(brokers){
  $('brokerList').innerHTML = brokers.map(b=>`<option value="${esc(b)}">`).join('');
}

async function rememberBroker(name){
  if(!name) return;
  const current = Array.from($('brokerList').options).map(o=>o.value);
  if(current.includes(name)) return;
  const next = [...current, name];
  renderBrokerList(next);
  try{
    await storage.set('banknifty-brokers', JSON.stringify(next));
  }catch(e){ /* best effort */ }
}

$('resetBtn').addEventListener('click', ()=>{
  $('tradeForm').reset();
  typeVal = null; sideVal = 'BUY';
  setToggle('g_type', null); setToggle('g_side', sideVal);
  $('f_date').valueAsDate = new Date();
  $('formStatus').textContent = '';
});

$('tradeForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(lockState().locked){
    $('formStatus').textContent = 'Locked for today — daily limit reached.';
    return;
  }
  if(cooldownRemainingMs() > 0){
    $('formStatus').textContent = 'Wait for the next-entry timer to finish.';
    return;
  }
  if(!typeVal || !sideVal){
    $('formStatus').textContent = 'Pick CE/PE and Buy/Sell.';
    return;
  }
  const entry = parseFloat($('f_entry').value);
  const qty = parseFloat($('f_qty').value);
  if(isNaN(entry) || isNaN(qty)){
    $('formStatus').textContent = 'Entry price and qty are required.';
    return;
  }
  const t = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    date: $('f_date').value,
    time: $('f_time').value,
    strike: $('f_strike').value,
    optType: typeVal,
    side: sideVal,
    qty: qty,
    entry: entry,
    exit: $('f_exit').value === '' ? null : parseFloat($('f_exit').value),
    exitTime: $('f_exittime').value,
    broker: $('f_broker').value.trim(),
    setup: $('f_setup').value,
    notes: $('f_notes').value,
  };
  trades.push(t);
  await rememberBroker(t.broker);
  const entryTs = t.time ? new Date(`${t.date}T${t.time}`).getTime() : Date.now();
  cooldownUntil = entryTs + 15*60*1000;
  await saveCooldown();
  $('formStatus').textContent = 'Trade added.';
  render();
  await saveTrades();
  $('tradeForm').reset();
  typeVal = null; sideVal = 'BUY';
  setToggle('g_type', null); setToggle('g_side', sideVal);
  $('f_date').valueAsDate = new Date();
  setTimeout(()=>{ if($('formStatus').textContent==='Trade added.') $('formStatus').textContent=''; }, 2000);
});

$('f_date').valueAsDate = new Date();
sideVal = 'BUY'; setToggle('g_side', sideVal);
loadBrokers();
loadSettings().then(loadTrades);
loadCooldown().then(renderCooldownBanner);
setInterval(renderCooldownBanner, 1000);
</script>
</body>
</html>
