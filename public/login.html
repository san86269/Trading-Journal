<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — BANKNIFTY Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14; --panel:#111720; --panel-2:#151C26; --line:#263241;
    --text:#F3F6FA; --muted:#8B98A9; --amber:#E8A93A; --red:#F1594F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top,0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:28px;width:100%;max-width:340px;
  }
  h1{font-size:16px;font-weight:600;margin:0 0 18px 0;}
  label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;}
  input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
    color:var(--text);padding:9px 10px;font-size:14px;margin-bottom:14px;
  }
  input:focus{outline:1px solid var(--amber);border-color:var(--amber);}
  button{
    width:100%;background:var(--amber);color:#1A1300;border:none;border-radius:5px;
    padding:10px 0;font-weight:600;font-size:14px;cursor:pointer;
  }
  button:hover{filter:brightness(1.08);}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:14px;}
</style>
</head>
<body>
  <div class="card">
    <h1>BANKNIFTY Journal</h1>
    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" autocomplete="username" required>
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div class="err" id="err"></div>
    </form>
  </div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try{
    const res = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      })
    });
    if(res.ok){
      window.location.href = '/';
    } else {
      errEl.textContent = 'Invalid username or password.';
    }
  }catch(err){
    errEl.textContent = 'Could not reach the server — try again.';
  }
});
</script>
</body>
</html>
